services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-constructor}
      POSTGRES_USER: ${POSTGRES_USER:-constructor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-constructor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-constructor} -d ${POSTGRES_DB:-constructor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-constructor}:${POSTGRES_PASSWORD:-constructor}@db:5432/${POSTGRES_DB:-constructor}
      DJANGO_SETTINGS_MODULE: config.settings.dev
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
