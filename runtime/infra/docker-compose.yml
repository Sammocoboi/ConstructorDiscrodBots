name: discord-constructor-runtime

# Runtime-only stack for local development against a PostgreSQL instance that
# already has Django migrations applied (for example the root docker-compose.yml
# stack). Production uses the single root docker-compose.prod.yml instead.
services:
  migrate:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    volumes:
      - ./migrations:/migrations:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - sh
      - -c
      - >-
        psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1
        -f /migrations/001_runtime.sql
    restart: "no"

  runtime:
    build:
      context: ..
      dockerfile: infra/Dockerfile.runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WORKER_ID: ${WORKER_ID:-runtime-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_BOTS_PER_WORKER: ${MAX_BOTS_PER_WORKER:-25}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-15}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-10}
      COMMAND_POLL_INTERVAL: ${COMMAND_POLL_INTERVAL:-30}
      RESTART_LIMIT: ${RESTART_LIMIT:-5}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RUNTIME_PORT:-8080}:8080"
    restart: unless-stopped
    stop_grace_period: 20s
