          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiscordExchangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiscordExchangeRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
