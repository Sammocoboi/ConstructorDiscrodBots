openapi: 3.0.3
info:
  title: Constructor Discord Bots API
  version: 1.0.0
  description: 'API платформы для визуального создания, настройки и хостинга Discord-ботов.
    Префикс: /api/v1/. Аутентификация: Authorization: Bearer <access_token>.'
paths:
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      summary: Регистрация по email и паролю
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: Validation error
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      summary: Вход по email и паролю
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: Invalid credentials
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      summary: Обновить access-токен по refresh-cookie
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: New access token
        '401':
          description: Invalid refresh token
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      summary: Выйти из текущей сессии
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all:
    post:
      operationId: auth_logout_all_create
      summary: Выйти на всех устройствах
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Sessions revoked
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      summary: Получить CSRF-cookie
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/health:
    get:
      operationId: auth_health_retrieve
      summary: Health check
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: Service is alive
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      summary: Текущий профиль
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Обновить профиль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_destroy
      summary: Мягко удалить аккаунт
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/sessions:
    get:
      operationId: auth_me_sessions_list
      summary: Активные сессии
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefreshSession'
          description: ''
  /api/v1/auth/me/sessions/{session_id}:
    delete:
      operationId: auth_me_sessions_destroy
      summary: Отозвать сессию
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/discord/login:
