  /api/v1/bots/:
    get:
      operationId: bots_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: desired_state
        schema:
          type: string
          enum:
          - running
          - stopped
        description: |-
          * `running` - Должен работать
          * `stopped` - Должен быть остановлен
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
