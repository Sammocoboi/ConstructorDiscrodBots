components:
  schemas:
    Bot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        discord_application_id:
          type: string
          readOnly: true
        discord_bot_user_id:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status0aaEnum'
          readOnly: true
        desired_state:
          allOf:
          - $ref: '#/components/schemas/DesiredStateEnum'
          readOnly: true
        active_version_number:
          type: integer
          readOnly: true
        profile:
          readOnly: true
        intents:
          readOnly: true
        has_token:
          type: boolean
          readOnly: true
        token_masked:
          type: string
          readOnly: true
        last_error:
          type: string
          readOnly: true
        last_error_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_version_number
      - created_at
      - desired_state
      - discord_application_id
      - discord_bot_user_id
      - has_token
      - id
      - intents
      - last_error
      - last_error_at
      - name
      - profile
      - status
      - token_masked
      - updated_at
    BotCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_application_id:
          type: string
          maxLength: 32
        token:
          type: string
          writeOnly: true
        profile: {}
        intents: {}
      required:
      - name
    BotGuild:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        guild_id:
          type: string
          readOnly: true
        guild_name:
          type: string
          maxLength: 100
        joined_at:
          type: string
          format: date-time
          readOnly: true
        left_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settings: {}
        enabled_modules: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - guild_id
      - id
      - joined_at
      - left_at
      - updated_at
    BotGuildRequest:
      type: object
      properties:
        guild_name:
          type: string
          maxLength: 100
        settings: {}
        enabled_modules: {}
    BotRuntimeState:
      type: object
      properties:
        worker_id:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status0aaEnum'
          readOnly: true
        latency_ms:
          type: integer
          readOnly: true
          nullable: true
        guild_count:
          type: integer
          readOnly: true
        uptime_seconds:
          type: integer
          readOnly: true
        version_number:
          type: integer
          readOnly: true
          nullable: true
        heartbeat_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_alive:
          type: boolean
          readOnly: true
      required:
      - guild_count
      - heartbeat_at
      - is_alive
      - latency_ms
      - status
      - uptime_seconds
      - version_number
      - worker_id
    BotStatus:
      type: object
      properties:
        bot_id:
          type: string
          format: uuid
        status:
          type: string
        desired_state:
          type: string
        runtime:
          allOf:
          - $ref: '#/components/schemas/BotRuntimeState'
          nullable: true
      required:
      - bot_id
      - desired_state
      - runtime
      - status
    BotUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        discord_application_id:
          type: string
          maxLength: 32
        profile: {}
        intents: {}
      required:
      - name
    BotUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        discord_application_id:
          type: string
          maxLength: 32
        profile: {}
        intents: {}
      required:
      - name
    BotVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        content: {}
        comment:
          type: string
          maxLength: 255
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
