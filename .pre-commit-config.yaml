# Хуки запускаются до коммита: pre-commit install
# Полный прогон: pre-commit run --all-files
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets-hook
        # Ложные срабатывания на примеры из .env.example и тестовые значения.
        args:
          - "--exclude-lines"
          - "(?i)(change-me|example\\.com|ci-only|test_|dummy|placeholder|your-)"
        exclude: |
          (?x)^(
            backend/migrations/.*|
            .*\.lock|
            .*\.docx|
            docs/openapi\.yaml
          )$
