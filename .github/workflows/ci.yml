name: CI

on:
  push:
    paths:
      - "proect/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "proect/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proect

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proect/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy runtime

      - name: Test
        run: pytest -q
