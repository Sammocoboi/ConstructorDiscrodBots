name: discord-constructor

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-constructor}
  POSTGRES_USER: ${POSTGRES_USER:-constructor}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

services:
  postgres:
    image: postgres:16-alpine
    environment: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: constructor-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN},${API_DOMAIN},backend,localhost,127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-constructor}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
    volumes:
      - backend_static:/app/staticfiles
      - ./runtime/infra/migrations:/runtime-migrations:ro
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1
        -f /runtime-migrations/001_runtime.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: constructor-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN},${API_DOMAIN},backend,localhost,127.0.0.1
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-constructor}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      FRONTEND_URL: https://${APP_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN},https://${API_DOMAIN}
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  runtime:
    build:
      context: ./runtime
      dockerfile: infra/Dockerfile.runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-constructor}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      WORKER_ID: ${WORKER_ID:-runtime-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_BOTS_PER_WORKER: ${MAX_BOTS_PER_WORKER:-25}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-15}
      RECONCILE_INTERVAL: ${RECONCILE_INTERVAL:-10}
      COMMAND_POLL_INTERVAL: ${COMMAND_POLL_INTERVAL:-30}
      RESTART_LIMIT: ${RESTART_LIMIT:-5}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8080
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_ADMIN_URL: https://${API_DOMAIN}/admin/
    image: constructor-frontend:${IMAGE_TAG:-latest}
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - backend_media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-constructor}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./ops/backup.sh:/usr/local/bin/backup.sh:ro
      - ./ops/restore.sh:/usr/local/bin/restore.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  backend_media:
  caddy_data:
  caddy_config:
  prometheus_data:
